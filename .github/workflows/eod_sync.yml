name: NSE 16:30 IST Market Sync Scheduler

on:
  schedule:
    # 16:30 IST = 11:00 UTC (Monday to Friday)
    - cron: '0 11 * * 1-5'
  workflow_dispatch:

jobs:
  trigger_eod_sync:
    runs-on: ubuntu-latest
    steps:
      - name: Wake Backend and Run Synchronizer
        run: |
          curl -X POST "https://dhyanaksh-quant-terminal.onrender.com/api/v1/system/sync-eod" \
               -H "X-Sync-Token: ${{ secrets.CRON_SECRET_KEY || 'dhyanaksh_sync_key' }}" \
               --max-time 900 \
               --retry 3 \
               --retry-delay 10

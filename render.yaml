services:
  # 1. FastAPI Quant Backend Web Service
  - type: web
    name: dhyanaksh-quant-api
    env: python
    region: singapore
    plan: free
    buildCommand: "pip install -r requirements.txt"
    startCommand: "python -m uvicorn app.main:app --host 0.0.0.0 --port $PORT --timeout-keep-alive 120 --workers 2"
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.9
      - key: PORT
        value: 8000
